    <!-- The page's content is in the HTML (scripts/prerender.mjs): a visitor who chose
         another language before, or follows a ?lang= link, goes to that page before any of
         it is drawn. Never the browser's language: crawlers read pages with an English
         browser, and must find the French home here. Same rules as settleLang() in
         src/lib/lang.ts, which still runs as a fallback. -->
    <script>
      ;(function () {
        var paths = { fr: '/', en: '/en/', it: '/it/' }
        try {
          var target = new URLSearchParams(location.search).get('lang')
          if (!paths[target]) {
            try {
              target = localStorage.getItem('lang')
            } catch (e) {
              target = null
            }
          }
          if (paths[target] && target !== 'fr') location.replace(paths[target] + location.hash)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
